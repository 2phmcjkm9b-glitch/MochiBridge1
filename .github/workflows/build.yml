name: Build MochiBridge iOS clean v31

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v31 protocol patch
        working-directory: MochiBridge
        run: |
          set -euo pipefail
          python3 fix_v31.py
          test -f MochiBridge/MochiBridgeApp.swift
          grep -F 'TX WITH_RESPONSE' MochiBridge/MochiBridgeApp.swift
          grep -F 'BATTERY PACKET:' MochiBridge/MochiBridgeApp.swift
          grep -F 'MUSIC RX command=' MochiBridge/MochiBridgeApp.swift
          grep -F 'MUSIC TX command=' MochiBridge/MochiBridgeApp.swift
          echo 'V31 SOURCE PATCH PASSED'

      - name: Build unsigned iOS app
        working-directory: MochiBridge
        run: |
          set -euo pipefail
          xcodebuild -project MochiBridge.xcodeproj -scheme MochiBridge -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee ../xcodebuild.log

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="MochiBridge/build/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$BUILD_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo 'ERROR: no .app produced'
            find "$BUILD_DIR" -maxdepth 2 -print || true
            exit 1
          fi
          rm -rf Payload IPA_CHECK MochiBridge-v31-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/MochiBridge.app
          APP_DIR="Payload/MochiBridge.app"
          EXECUTABLE="$APP_DIR/MochiBridge"
          test -f "$EXECUTABLE"
          chmod 755 "$EXECUTABLE"

          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable MochiBridge' "$APP_DIR/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string MochiBridge' "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 2.1' "$APP_DIR/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 31' "$APP_DIR/Info.plist" || true

          ditto -c -k --sequesterRsrc --keepParent Payload MochiBridge-v31-unsigned.ipa
          test -s MochiBridge-v31-unsigned.ipa

          rm -rf IPA_CHECK
          mkdir IPA_CHECK
          unzip -q MochiBridge-v31-unsigned.ipa -d IPA_CHECK
          CHECK_APP="IPA_CHECK/Payload/MochiBridge.app"
          CHECK_EXEC="$CHECK_APP/MochiBridge"
          test -f "$CHECK_EXEC"
          test -x "$CHECK_EXEC"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$CHECK_APP/Info.plist")" = 'MochiBridge'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$CHECK_APP/Info.plist")" = '31'

          /usr/bin/file "$CHECK_EXEC"
          /usr/bin/otool -hv "$CHECK_EXEC"
          /usr/bin/codesign --verify --deep --strict "$CHECK_APP" 2>/dev/null || true
          echo 'V31 IPA PACKAGE VALIDATION PASSED'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MochiBridge-v31-unsigned-IPA
          path: MochiBridge-v31-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MochiBridge-v31-build-log
          path: MochiBridge/xcodebuild.log
          if-no-files-found: warn
