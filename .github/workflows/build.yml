name: Build MochiBridge iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        working-directory: MochiBridge
        run: |
          xcodebuild \
            -project MochiBridge.xcodeproj \
            -scheme MochiBridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Prepare IPA
        run: |
          set -e

          APP_PATH=$(find MochiBridge/build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name "*.app" \
            -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: MochiBridge.app was not found"
            exit 1
          fi

          rm -rf Payload MochiBridge-unsigned.ipa
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          APP_DIR="Payload/$(basename "$APP_PATH")"
          EXECUTABLE="$APP_DIR/MochiBridge"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: executable not found"
            exit 1
          fi

          chmod 755 "$EXECUTABLE"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable MochiBridge" \
            "$APP_DIR/Info.plist" || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleExecutable string MochiBridge" \
            "$APP_DIR/Info.plist"

          echo "=== EXECUTABLE CHECK ==="
          ls -l "$EXECUTABLE"
          file "$EXECUTABLE"

          echo "=== PLIST CHECK ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_DIR/Info.plist"

          ditto -c -k --sequesterRsrc --keepParent \
            Payload MochiBridge-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MochiBridge-unsigned-IPA
          path: MochiBridge-unsigned.ipa
          if-no-files-found: error
