name: Build MochiBridge iOS v28

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply deterministic v28c protocol implementation
        run: python3 MochiBridge/fix_v28c.py

      - name: Validate source markers
        working-directory: MochiBridge
        run: |
          set -euo pipefail
          grep -F 'NOTIFY ON — BLE READY FOR TX/RX' MochiBridge/MochiBridgeApp.swift
          grep -F 'while !queue.isEmpty && p.canSendWriteWithoutResponse' MochiBridge/MochiBridgeApp.swift
          grep -F 'BATTERY RAW=' MochiBridge/MochiBridgeApp.swift
          grep -F 'b.count == 7' MochiBridge/MochiBridgeApp.swift
          grep -F 'Apple Music:' MochiBridge/MochiBridgeApp.swift
          grep -F 'MUSIC PREPARE ERROR:' MochiBridge/MochiBridgeApp.swift
          python3 -m py_compile fix_v28b.py fix_v28c.py

      - name: Build unsigned iOS app
        working-directory: MochiBridge
        run: |
          set -euo pipefail
          xcodebuild -project MochiBridge.xcodeproj -scheme MochiBridge -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee ../xcodebuild.log

      - name: Prepare and validate IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find MochiBridge/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)
          test -n "$APP_PATH"
          rm -rf Payload IPA_CHECK MochiBridge-v28-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          APP_DIR="Payload/$(basename "$APP_PATH")"
          EXECUTABLE="$APP_DIR/MochiBridge"
          test -f "$EXECUTABLE"
          chmod 755 "$EXECUTABLE"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable MochiBridge' "$APP_DIR/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string MochiBridge' "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.4' "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 8' "$APP_DIR/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent Payload MochiBridge-v28-unsigned.ipa

          mkdir IPA_CHECK
          unzip -q MochiBridge-v28-unsigned.ipa -d IPA_CHECK
          CHECK_APP='IPA_CHECK/Payload/MochiBridge.app'
          CHECK_EXEC="$CHECK_APP/MochiBridge"
          test -f "$CHECK_EXEC"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$CHECK_APP/Info.plist")" = 'MochiBridge'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$CHECK_APP/Info.plist")" = '8'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$CHECK_APP/Info.plist")" = '1.4'
          test -x "$CHECK_EXEC"
          file "$CHECK_EXEC"
          echo 'V28 IPA VALIDATION PASSED'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MochiBridge-v28-unsigned-IPA
          path: MochiBridge-v28-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MochiBridge-v28-build-log
          path: xcodebuild.log
          if-no-files-found: warn
